<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <title>Bookstore Dashboard</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
    <style>
      body {
        font-family: system-ui, sans-serif;
        margin: 0;
        background: #f4f5f7;
        color: #1f2937;
      }
      header {
        background: #1f2937;
        color: #fff;
        padding: 12px 24px;
        display: flex;
        gap: 16px;
        align-items: center;
      }
      nav button {
        padding: 8px 16px;
        border: 0;
        background: none;
        cursor: pointer;
        font-size: 15px;
      }
      nav button.active {
        border-bottom: 3px solid #2563eb;
        font-weight: 600;
      }
      main {
        padding: 24px;
      }
      .tab {
        display: none;
      }
      .tab.active {
        display: block;
      }
      .cards {
        display: flex;
        gap: 16px;
        flex-wrap: wrap;
      }
      .card {
        background: #fff;
        border-radius: 8px;
        padding: 16px 20px;
        min-width: 180px;
        box-shadow: 0 1px 3px #0002;
      }
      .card .value {
        font-size: 28px;
        font-weight: 700;
      }
      .chart-box {
        position: relative;
        height: 380px;
        background: #fff;
        border-radius: 8px;
        padding: 12px;
        box-shadow: 0 1px 3px #0002;
      }
      table {
        border-collapse: collapse;
        background: #fff;
      }
      th,
      td {
        padding: 8px 12px;
        border-bottom: 1px solid #e5e7eb;
        text-align: left;
      }
      #chat {
        position: fixed;
        right: 20px;
        bottom: 20px;
        width: 340px;
        height: 440px;
        background: #fff;
        border-radius: 10px;
        box-shadow: 0 4px 16px #0003;
        display: flex;
        flex-direction: column;
      }
      #chat-messages {
        flex: 1;
        overflow-y: auto;
        padding: 12px;
        display: flex;
        flex-direction: column;
        gap: 8px;
      }
      .msg {
        padding: 8px 12px;
        border-radius: 10px;
        max-width: 85%;
        white-space: pre-wrap;
      }
      .msg.user {
        background: #2563eb;
        color: #fff;
        align-self: flex-end;
      }
      .msg.assistant {
        background: #e5e7eb;
        align-self: flex-start;
      }
      #chat-form {
        display: flex;
        gap: 8px;
        padding: 10px;
        border-top: 1px solid #e5e7eb;
      }
      #chat-input {
        flex: 1;
        padding: 8px;
      }
    </style>
  </head>
  <body>
    <header>
      <h2>Bookstore Dashboard</h2>
      <select id="store-select"></select>
    </header>
    <nav>
      <button class="active" data-tab="overview">Overview</button>
      <button data-tab="revenue">Revenue</button>
      <button data-tab="people">People</button>
    </nav>
    <main>
      <section id="overview" class="tab active">
        <div class="cards">
          <div class="card">
            <div>Unique users</div>
            <div class="value" id="unique-users">–</div>
          </div>
          <div class="card">
            <div>Author sets</div>
            <div class="value" id="author-sets">–</div>
          </div>
          <div class="card">
            <div>Top author(s)</div>
            <div class="value" id="top-authors">–</div>
          </div>
        </div>
      </section>
      <section id="revenue" class="tab">
        <div class="chart-box"><canvas id="revenue-chart"></canvas></div>
        <ol id="top-days"></ol>
      </section>
      <section id="people" class="tab">
        <div id="best-buyer"></div>
      </section>
    </main>
    <div id="chat">
      <div id="chat-messages"></div>
      <form id="chat-form">
        <input
          id="chat-input"
          placeholder="Ask about the data..."
          autocomplete="off"
        />
        <button type="submit">Send</button>
      </form>
    </div>
    <script src="app.js"></script>
  </body>
</html>
