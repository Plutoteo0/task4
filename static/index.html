<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <title>Bookstore Dashboard</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header>
      <h2>Bookstore Dashboard</h2>
      <select id="store-select"></select>
    </header>
    <nav>
      <button class="active" data-tab="overview">Overview</button>
      <button data-tab="revenue">Revenue</button>
      <button data-tab="people">People</button>
      <button data-tab="users">Users</button>
    </nav>
    <main>
      <section id="overview" class="tab active">
        <div class="cards">
          <div class="card">
            <div>Unique users</div>
            <div class="value" id="unique-users">–</div>
          </div>
          <div class="card">
            <div>Author sets</div>
            <div class="value" id="author-sets">–</div>
          </div>
          <div class="card">
            <div>Top author(s)</div>
            <div class="value" id="top-authors">–</div>
          </div>
        </div>
      </section>
      <section id="revenue" class="tab">
        <div class="chart-box"><canvas id="revenue-chart"></canvas></div>
        <ol id="top-days"></ol>
      </section>
      <section id="people" class="tab">
        <div id="best-buyer"></div>
      </section>
      <section id="users" class="tab">
        <form id="users-form">
          <input id="users-prefix" placeholder="Email starts with, e.g. s,p" />
          <button type="submit">Filter</button>
        </form>
        <p id="users-count"></p>
        <div id="users-table"></div>
      </section>
    </main>
    <div id="chat">
      <div id="chat-messages"></div>
      <form id="chat-form">
        <input
          id="chat-input"
          placeholder="Ask about the data..."
          autocomplete="off"
        />
        <button type="submit">Send</button>
      </form>
    </div>
    <script src="app.js"></script>
  </body>
</html>
